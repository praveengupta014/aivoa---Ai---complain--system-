version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: aivoa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aivoa_complaints
    ports:
      - "5432:5432"
    volumes:
      - aivoa_pgdata:/var/lib/postgresql/data

volumes:
  aivoa_pgdata:
